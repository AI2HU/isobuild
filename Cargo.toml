[workspace]
resolver = "3"
members = ["crates/report", "crates/diagnostics", "crates/policy", "crates/isobuild", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
isobuild = { path = "crates/isobuild", version = "0.1.0" }
isobuild-report = { path = "crates/report", version = "0.1.0" }
isobuild-diagnostics = { path = "crates/diagnostics", version = "0.1.0" }
isobuild-policy = { path = "crates/policy", version = "0.1.0" }
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
