[package]
name = "cargo-sandbox"
description = "Cargo subcommand that builds and tests untrusted Rust projects in a sandbox, using isobuild"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "../../README.md"

[[bin]]
name = "cargo-sandbox"
path = "src/main.rs"

[dependencies]
isobuild.workspace = true
isobuild-report.workspace = true
clap.workspace = true
ctrlc.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
